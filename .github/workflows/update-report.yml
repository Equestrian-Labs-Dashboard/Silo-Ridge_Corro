name: Update Silo Ridge report

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "docs/index.html"
      - "package*.json"
      - ".github/workflows/update-report.yml"

permissions:
  contents: write

concurrency:
  group: silo-ridge-report
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Generate Silo Ridge report from Shopify
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
        run: npm run generate
      - name: Commit refreshed report data
        run: |
          if git diff --quiet -- docs/report-data.json; then
            echo "No report changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/report-data.json
          git commit -m "chore: refresh Silo Ridge report"
          git push
